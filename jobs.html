<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岗位清单 - JobFill</title>
  <link rel="stylesheet" href="jobs.css">
</head>
<body>
  <header class="topbar">
    <h1>岗位清单</h1>
    <div class="top-actions">
      <button id="btn-batch-open">🔗 批量打开招聘站</button>
      <button id="btn-pull-config">⚙ 拉取设置</button>
      <button id="btn-import">导入 JSON</button>
      <button id="btn-export">导出 JSON</button>
      <button id="btn-add">+ 新增岗位</button>
      <button id="btn-del-expired">🗑 删除过期</button>
    </div>
  </header>

  <div id="stats" class="stats"></div>

  <div class="filters">
    <select id="f-category"><option>全部</option></select>
    <select id="f-status"><option>全部</option></select>
    <input id="f-region" placeholder="地区" list="region-list">
    <datalist id="region-list"></datalist>
    <input id="f-keyword" placeholder="搜索岗位/单位">
    <select id="f-sort">
      <option value="deadline">按截止日期</option>
      <option value="region">按地区</option>
      <option value="">原顺序</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>地区</th><th>分类</th><th>岗位</th><th>单位</th><th>薪资</th><th>状态</th><th>截止</th><th>操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pager">
    <button id="prev">上一页</button>
    <span id="pager-info"></span>
    <button id="next">下一页</button>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="modal-title">新增岗位</h2>
      <label>岗位名称<input id="m-position"></label>
      <label>目标单位<input id="m-company"></label>
      <label>地区<input id="m-region"></label>
      <label>分类<select id="m-category"></select></label>
      <label>薪资区间<input id="m-salary" placeholder="如 9-14"></label>
      <label>投递渠道<input id="m-channel" placeholder="如 BOSS直聘"></label>
      <label>投递链接<input id="m-link" placeholder="https://..."></label>
      <label>截止日期<input id="m-deadline" type="date"></label>
      <label>备注<textarea id="m-note" rows="2"></textarea></label>
      <div class="modal-actions">
        <button id="m-cancel">取消</button>
        <button id="m-save">保存</button>
      </div>
    </div>
  </div>

  <div id="pull-modal" class="modal" hidden>
    <div class="modal-box">
      <h2>⚙ 拉取设置</h2>
      <label>搜索关键词（一行一个，批量打开用）<textarea id="pc-keywords" rows="5" placeholder="软件测试工程师&#10;测试开发工程师"></textarea></label>
      <label>地区（附加到关键词后）<input id="pc-region" placeholder="成都"></label>
      <label>批量打开来源（可多选）</label>
      <div class="check-group" id="pc-sources"></div>
      <label>官网拉取数量（爬虫每次最多抓取）<input id="pc-count" type="number" min="1" max="500" placeholder="50"></label>
      <div class="pull-hint">
        官网公告岗位（公务员/事业编/教师/银行/国企/央企/军队文职）由本地爬虫抓取：
        运行 <code>python crawler/crawl.py</code> 生成
        <code>crawler/output/jobs.json</code>，再用「导入 JSON」导入。
      </div>
      <div class="modal-actions">
        <button id="pc-cancel">取消</button>
        <button id="pc-save">保存</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept=".json,application/json" hidden>
  <div id="toast" class="toast"></div>

  <script src="jobs-core.js"></script>
  <script src="jobs.js"></script>
</body>
</html>

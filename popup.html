<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>简历自动填写</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      background: #f5f7fa;
      color: #2c3e50;
    }

    /* 顶部 */
    .header {
      background: #1a365d;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header span { font-size: 11px; opacity: .7; }

    /* Tab 切换 */
    .tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    .tab {
      flex: 1;
      padding: 9px 4px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      color: #718096;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .tab.active {
      color: #1a365d;
      border-bottom-color: #1a365d;
      font-weight: 600;
    }
    .tab:hover:not(.active) { color: #2d3748; }

    /* 内容区 */
    .panel { display: none; padding: 14px 16px; }
    .panel.active { display: block; }

    /* 表单项 */
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      color: #4a5568;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 5px;
      font-size: 13px;
      font-family: inherit;
      color: #2d3748;
      background: #fff;
      transition: border-color .2s;
      outline: none;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: #1a365d; }
    .field textarea { resize: vertical; min-height: 72px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* 按钮 */
    .btn-wrap {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
    }
    .btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #1a365d; color: #fff; }
    .btn-fill    { background: #38a169; color: #fff; }

    /* 提示信息 */
    .toast {
      position: fixed;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d3748;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* 填写结果 */
    #result {
      padding: 8px 16px;
      font-size: 12px;
      color: #38a169;
      background: #f0fff4;
      border-top: 1px solid #c6f6d5;
      display: none;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📄 简历自动填写</h1>
  <span>编辑信息 → 点击填写</span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="basic">基本信息</div>
  <div class="tab" data-tab="edu">教育经历</div>
  <div class="tab" data-tab="work">工作经历</div>
  <div class="tab" data-tab="extra">其他</div>
</div>

<!-- 基本信息 -->
<div class="panel active" id="tab-basic">
  <div class="row">
    <div class="field"><label>姓名</label><input id="name" placeholder="庄赖宏" /></div>
    <div class="field"><label>性别</label>
      <select id="gender">
        <option value="">请选择</option>
        <option value="男">男</option>
        <option value="女">女</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="field"><label>手机号</label><input id="phone" placeholder="15305063507" /></div>
    <div class="field"><label>邮箱</label><input id="email" placeholder="xxx@163.com" /></div>
  </div>
  <div class="row">
    <div class="field"><label>出生年月</label><input id="birthday" placeholder="2002-01" /></div>
    <div class="field"><label>籍贯/所在城市</label><input id="city" placeholder="福建漳州" /></div>
  </div>
  <div class="row">
    <div class="field"><label>期望薪资</label><input id="salary" placeholder="面议" /></div>
    <div class="field"><label>到岗时间</label><input id="available" placeholder="随时到岗" /></div>
  </div>
  <div class="field"><label>求职意向</label><input id="intention" placeholder="大模型应用实习生" /></div>
</div>

<!-- 教育经历 -->
<div class="panel" id="tab-edu">
  <div class="field"><label>最高学历</label>
    <select id="degree">
      <option value="">请选择</option>
      <option value="博士">博士</option>
      <option value="硕士">硕士</option>
      <option value="本科">本科</option>
      <option value="大专">大专</option>
    </select>
  </div>
  <div class="field"><label>学校名称</label><input id="school" placeholder="大连理工大学" /></div>
  <div class="field"><label>专业</label><input id="major" placeholder="智慧城市建造与管理" /></div>
  <div class="row">
    <div class="field"><label>入学时间</label><input id="edu_start" placeholder="2024-09" /></div>
    <div class="field"><label>毕业时间</label><input id="edu_end" placeholder="2027-06" /></div>
  </div>
  <div class="field"><label>GPA / 排名（选填）</label><input id="gpa" placeholder="例：3.8/4.0" /></div>
</div>

<!-- 工作/实习经历 -->
<div class="panel" id="tab-work">
  <div class="field"><label>公司名称</label><input id="company" placeholder="大连智水慧成科技有限责任公司" /></div>
  <div class="field"><label>职位名称</label><input id="position" placeholder="研发部实习生" /></div>
  <div class="row">
    <div class="field"><label>开始时间</label><input id="work_start" placeholder="2024-09" /></div>
    <div class="field"><label>结束时间</label><input id="work_end" placeholder="2025-06" /></div>
  </div>
  <div class="field"><label>工作描述</label>
    <textarea id="work_desc" placeholder="简要描述工作内容、成果..."></textarea>
  </div>
</div>

<!-- 其他 -->
<div class="panel" id="tab-extra">
  <div class="field"><label>自我介绍</label>
    <textarea id="intro" placeholder="具备扎实的深度学习与编程基础，专注 LLM 应用开发..."></textarea>
  </div>
  <div class="field"><label>技能特长</label>
    <textarea id="skills" placeholder="Python / PyTorch / RAG / Agent / Prompt Engineering..."></textarea>
  </div>
  <div class="field"><label>GitHub 链接</label><input id="github" placeholder="https://github.com/zhuanglaihong" /></div>
  <div class="field"><label>个人主页</label><input id="homepage" placeholder="https://zhuanglaihong.github.io" /></div>
</div>

<div id="result">✓ 已填写 <span id="result-count">0</span> 个字段</div>

<div class="btn-wrap">
  <button class="btn btn-primary" id="btn-save">保存</button>
  <button class="btn btn-fill"    id="btn-fill">🚀 自动填写</button>
</div>
<div style="padding:8px 16px 12px; text-align:center; border-top:1px solid #e2e8f0">
  <a id="btn-options" href="#" style="font-size:12px; color:#4a90d9; text-decoration:none;">
    ⚙ 打开完整简历管理页
  </a>
</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>简历自动填写</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:320px;font-family:'Microsoft YaHei',sans-serif;font-size:13px;background:#f0f4f8;color:#2d3748}

    /* 顶部渐变 */
    .header{background:linear-gradient(135deg,#1a365d 0%,#2b6cb0 100%);color:#fff;padding:16px}
    .header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .logo{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .header-title{flex:1}
    .header-title h1{font-size:15px;font-weight:700;letter-spacing:.5px}
    .header-title p{font-size:11px;opacity:.65;margin-top:2px}
    .header-version{font-size:10px;opacity:.5;background:rgba(255,255,255,.1);padding:2px 6px;border-radius:10px}

    /* 简历摘要卡片 */
    .profile-card{background:#fff;margin:12px;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .profile-name{font-size:16px;font-weight:700;color:#1a365d;display:flex;align-items:center;gap:6px}
    .profile-name .badge{font-size:10px;background:#ebf4ff;color:#2b6cb0;padding:2px 7px;border-radius:10px;font-weight:500}
    .profile-info{margin-top:8px;display:flex;flex-direction:column;gap:4px}
    .info-row{display:flex;align-items:center;gap:6px;font-size:12px;color:#4a5568}
    .info-row .icon{width:16px;text-align:center;font-size:11px;opacity:.7}
    .no-data{font-size:12px;color:#a0aec0;text-align:center;padding:6px 0}

    /* 填写进度 */
    .section-stats{background:#fff;margin:0 12px 12px;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .section-stats h3{font-size:11px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .stat-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .stat-row:last-child{margin-bottom:0}
    .stat-label{font-size:12px;color:#4a5568;width:64px;flex-shrink:0}
    .stat-bar-wrap{flex:1;height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
    .stat-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .4s}
    .stat-pct{font-size:11px;color:#718096;width:28px;text-align:right;flex-shrink:0}

    /* 操作按钮 */
    .actions{margin:0 12px 14px;display:flex;flex-direction:column;gap:7px}
    .btn{width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-primary{background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff}
    .btn-secondary{background:#fff;color:#2b6cb0;border:1.5px solid #bee3f8}
    .btn-green{background:linear-gradient(135deg,#276749,#38a169);color:#fff}

    /* 底部状态栏 */
    .footer{padding:8px 14px;border-top:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:space-between}
    .footer-status{font-size:11px;color:#718096;display:flex;align-items:center;gap:4px}
    .dot{width:6px;height:6px;border-radius:50%;background:#68d391}

    .toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#2d3748;color:#fff;padding:5px 14px;border-radius:14px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">📄</div>
    <div class="header-title">
      <h1>简历自动填写</h1>
      <p>Resume Auto Filler</p>
    </div>
    <span class="header-version">v1.0</span>
  </div>
</div>

<!-- 简历摘要 -->
<div class="profile-card" id="profile-card">
  <div class="no-data" id="profile-empty">暂无简历数据，请先导入或填写</div>
  <div id="profile-content" style="display:none">
    <div class="profile-name">
      <span id="pf-name">—</span>
      <span class="badge" id="pf-badge">未知身份</span>
    </div>
    <div class="profile-info">
      <div class="info-row"><span class="icon">📱</span><span id="pf-phone">—</span></div>
      <div class="info-row"><span class="icon">📧</span><span id="pf-email">—</span></div>
      <div class="info-row"><span class="icon">🎓</span><span id="pf-edu">—</span></div>
      <div class="info-row"><span class="icon">🎯</span><span id="pf-intention">—</span></div>
    </div>
  </div>
</div>

<!-- 各板块进度 -->
<div class="section-stats">
  <h3>简历完整度</h3>
  <div id="stats-rows">
    <div class="stat-row"><span class="stat-label">个人信息</span><div class="stat-bar-wrap"><div class="stat-bar" id="bar-personal" style="width:0%"></div></div><span class="stat-pct" id="pct-personal">0%</span></div>
    <div class="stat-row"><span class="stat-label">求职意向</span><div class="stat-bar-wrap"><div class="stat-bar" id="bar-intention" style="width:0%"></div></div><span class="stat-pct" id="pct-intention">0%</span></div>
    <div class="stat-row"><span class="stat-label">教育背景</span><div class="stat-bar-wrap"><div class="stat-bar" id="bar-education" style="width:0%"></div></div><span class="stat-pct" id="pct-education">0%</span></div>
    <div class="stat-row"><span class="stat-label">工作/实习</span><div class="stat-bar-wrap"><div class="stat-bar" id="bar-work" style="width:0%"></div></div><span class="stat-pct" id="pct-work">0%</span></div>
    <div class="stat-row"><span class="stat-label">技能&自评</span><div class="stat-bar-wrap"><div class="stat-bar" id="bar-skills" style="width:0%"></div></div><span class="stat-pct" id="pct-skills">0%</span></div>
  </div>
</div>

<!-- 操作按钮 -->
<div class="actions">
  <button class="btn btn-green" id="btn-panel">📋 显示填写面板</button>
  <button class="btn btn-primary" id="btn-options">⚙ 打开简历管理页</button>
  <button class="btn btn-secondary" id="btn-jobs">📋 岗位清单</button>
  <button class="btn btn-secondary" id="btn-materials">📁 材料库</button>
</div>

<div class="footer">
  <div class="footer-status"><span class="dot"></span>扩展已就绪</div>
  <span style="font-size:11px;color:#a0aec0" id="footer-total">—</span>
</div>

<div class="toast" id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
